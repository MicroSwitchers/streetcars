name: Deploy streetcars to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check departure and audio timing
        run: |
          node qa/check_graphics_budget.mjs
          node qa/check_cameras.mjs
          node qa/check_facade_windows.mjs
          node qa/check_sensory_logic.mjs
          node qa/check_weather_cycle.mjs
          node qa/check_departure_bell.mjs
          node qa/check_sounds.mjs
          node qa/check_stop_motion.mjs
          node qa/check_ride_settings.mjs
          node qa/check_routes.mjs
          node qa/check_dundas_districts.mjs
      - name: Build the versioned PWA
        run: python build_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pwa
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
